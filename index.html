  <title>立冬快乐逸冉！</title>
  <style>
    :root{color-scheme:dark;--ink:#f8f8f2;--muted:#c9d7e4;--gold:#f4dbab}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}body{overflow:hidden;background:#102238;color:var(--ink)}
    button{font:inherit}.scene{position:relative;width:100%;height:100svh;min-height:540px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 76% 18%,#536983 0,#253d59 17%,transparent 45%),linear-gradient(180deg,#0c1d34 0%,#274460 57%,#728da4 100%)}
    .scene:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 19% 27%,#aec2d929 0 1px,transparent 2px),radial-gradient(circle at 67% 46%,#e9f4ff45 0 1px,transparent 2px);background-size:180px 160px,270px 210px;opacity:.6}
    .moon{position:absolute;right:15%;top:12%;width:112px;aspect-ratio:1;border-radius:50%;background:#f8edce;box-shadow:0 0 35px #fff3d294,0 0 130px 45px #f8e6ba45;opacity:.94}
    .mountain{position:absolute;left:-8%;bottom:13%;width:116%;height:45%;clip-path:polygon(0 84%,12% 63%,20% 74%,34% 31%,45% 65%,57% 43%,72% 72%,84% 39%,100% 81%,100% 100%,0 100%);background:linear-gradient(165deg,#bed0d9 0%,#7e9db3 39%,#4b6a83 100%);opacity:.8;filter:blur(1px)}
    .mountain.back{bottom:19%;height:38%;transform:scaleX(-1);background:linear-gradient(175deg,#a1b7c5,#4e6b82);opacity:.38;filter:blur(3px)}
    .hill{position:absolute;left:-10%;bottom:-19%;width:125%;height:46%;border-radius:52% 42% 0 0/55% 55% 0 0;background:linear-gradient(175deg,#f9fdff 0%,#e6f0f5 32%,#a9c2d2 100%);transform:rotate(-3deg);box-shadow:0 -20px 90px #e1eff45c}.hill:after{content:"";position:absolute;left:-4%;top:14%;width:110%;height:88%;border-radius:50% 50% 0 0;background:linear-gradient(173deg,#f7fbfd,#c6dae5);transform:rotate(8deg) translateY(28%)}
    .grain{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}
    .snow{position:absolute;inset:0;pointer-events:none;z-index:6}.flake{position:absolute;top:-20px;width:var(--size);height:var(--size);border-radius:50%;background:#f5fbff;opacity:var(--opacity);filter:blur(var(--blur));animation:fall var(--duration) linear infinite;animation-delay:var(--delay)}@keyframes fall{to{transform:translate3d(var(--drift),105vh,0)}}
    .content{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;padding:clamp(32px,7vh,76px) 20px 28px}.eyebrow{margin:0 0 18px;letter-spacing:.45em;font-size:11px;font-weight:600;color:#f4e6c9;text-transform:uppercase;text-shadow:0 2px 12px #14253a}.winter-greeting{margin:0 0 10px;font-family:"Songti SC","Noto Serif CJK SC","STSong",serif;font-size:clamp(20px,2.6vw,30px);font-weight:400;letter-spacing:.36em;text-indent:.36em;color:#f8e7bd;text-shadow:0 2px 18px #172b44}.title{margin:0;font-family:"Songti SC","Noto Serif CJK SC","STSong",serif;font-size:clamp(42px,7vw,86px);font-weight:400;letter-spacing:.13em;text-indent:.13em;line-height:1.25;text-shadow:0 4px 26px #0a1d3380}.subtitle{margin:16px 0 0;color:#e8eff5;font-size:clamp(13px,1.5vw,17px);letter-spacing:.22em;text-shadow:0 2px 12px #14253a}.bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:15px;pointer-events:auto}.note{margin:0;color:#3b5870;font-size:12px;letter-spacing:.18em}.replay{border:1px solid #45637a;background:#17364eeb;color:#f7f4ed;border-radius:99px;padding:12px 26px;box-shadow:0 10px 30px #3358723d;cursor:pointer;letter-spacing:.18em;transition:transform .2s,background .2s}.replay:hover{transform:translateY(-3px);background:#284d68}.replay:focus-visible{outline:3px solid #f4dbab;outline-offset:4px}
    .messages{position:absolute;inset:0;z-index:4;pointer-events:none}.message{position:absolute;left:var(--x);top:var(--y);max-width:min(420px,72vw);padding:10px 17px;border:1px solid #ffffff70;border-radius:18px 18px 18px 4px;background:#f7fbf0e8;color:#29485e;font-size:clamp(12px,1.25vw,16px);line-height:1.5;letter-spacing:.06em;white-space:normal;overflow-wrap:anywhere;text-align:center;box-shadow:0 8px 28px #122b4870,0 0 25px #f8e9c166;backdrop-filter:blur(8px);transform:translate(-50%,-50%) scale(.4) rotate(var(--tilt));opacity:0;animation:appear 6.6s ease-in-out forwards}.message:nth-child(3n){background:#e6f1f5e8}.message:nth-child(5n){background:#fff0dce8}.message::before{content:attr(data-icon);color:#bd9a65;margin-right:8px;font-size:16px;vertical-align:-1px}@keyframes appear{0%{opacity:0;transform:translate(-50%,-20%) scale(.45) rotate(var(--tilt))}12%,70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--tilt))}100%{opacity:0;transform:translate(-50%,-95%) scale(.96) rotate(var(--tilt))}}
    .fireworks,.flowers{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fireworks{z-index:6}.flowers{z-index:7}
    .burst{position:absolute;width:0;height:0;filter:drop-shadow(0 0 10px var(--glow))}.burst::before,.burst::after{content:"";position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.burst::before{width:20px;height:20px;background:radial-gradient(circle,#fff 0%,var(--glow) 25%,transparent 72%);animation:burstFlash .65s ease-out forwards}.burst::after{width:22px;height:22px;border:2.5px solid var(--glow);box-shadow:0 0 18px var(--glow);animation:burstRing 1s ease-out forwards}.spark{position:absolute;left:0;top:0;line-height:1;color:var(--color);font-size:var(--size);text-shadow:0 0 10px currentColor,0 0 20px currentColor;white-space:nowrap;animation:sparkFly 1.35s cubic-bezier(.16,.65,.25,1) var(--delay) forwards;opacity:0;will-change:transform,opacity}
    @keyframes burstFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}22%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(3)}}@keyframes burstRing{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}@keyframes sparkFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0deg)}14%,62%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.65) rotate(var(--spin))}}
    .flower{position:absolute;width:var(--flower-size);aspect-ratio:1;filter:drop-shadow(0 5px 5px #1b3d5e88);transform:translate(-50%,-100%);animation:flowerFall 1.7s cubic-bezier(.18,.7,.24,1) both;will-change:transform,opacity}.flower svg{display:block;width:100%;height:100%}.flower.fade{animation:flowerFade .8s ease-in forwards}@keyframes flowerFall{0%{opacity:0;transform:translate(calc(-50% + var(--from-x)),calc(-100% + var(--from-y))) rotate(-35deg) scale(.45)}16%{opacity:1}72%{opacity:1;transform:translate(calc(-50% + 9px),calc(-100% - 18px)) rotate(12deg) scale(1.03)}100%{opacity:1;transform:translate(-50%,-100%) rotate(0deg) scale(1)}}@keyframes flowerFade{to{opacity:0;transform:translate(-50%,-106%) scale(.8)}}
    .prompt{position:absolute;z-index:7;left:50%;top:55%;transform:translate(-50%,-50%);font-family:"Songti SC","STSong",serif;font-size:clamp(18px,2.4vw,28px);letter-spacing:.22em;text-indent:.22em;color:#fff9e9;text-shadow:0 2px 15px #14253a;text-align:center;white-space:nowrap;transition:opacity 1.5s}.prompt.hide{opacity:0}
    .star{position:absolute;z-index:2;color:#e7f1f9;font-size:16px;text-shadow:0 0 12px #fff;opacity:.55;animation:twinkle 4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.15;transform:scale(.65)}}
    @media(max-width:700px){.scene{min-height:0}.content{padding-top:8vh}.moon{width:74px;right:10%;top:27%}.title{font-size:clamp(38px,9vw,58px)}.subtitle{font-size:12px;letter-spacing:.13em}.message{max-width:78vw;font-size:13px;padding:9px 12px}.note{color:#345269}.hill{bottom:-15%;height:38%}.mountain{bottom:16%}.prompt{top:50%;font-size:18px}.bottom{padding-bottom:3vh}}
    @media(prefers-reduced-motion:reduce){.flake,.star{animation:none}.message{animation-duration:8s}.fireworks{display:none}.flower{animation-duration:.01ms}.flower.fade{animation-duration:.01ms}.replay{transition:none}}
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="雪夜里不断浮现温暖的话语">
    <div class="moon" aria-hidden="true"></div><div class="star" style="left:12%;top:18%" aria-hidden="true">✧</div><div class="star" style="left:45%;top:28%;animation-delay:2s" aria-hidden="true">✦</div><div class="star" style="right:8%;top:40%;animation-delay:1s" aria-hidden="true">✧</div>
    <div class="mountain back" aria-hidden="true"></div><div class="mountain" aria-hidden="true"></div><div class="hill" aria-hidden="true"></div>
    <div class="snow" id="snow" aria-hidden="true"></div><div class="messages" id="messages" aria-hidden="true"></div><div class="fireworks" id="fireworks" aria-hidden="true"></div><div class="flowers" id="flowers" aria-hidden="true"></div>
    <p class="prompt" id="prompt">有些话，想在下雪时告诉你</p>
    <div class="content"><p class="eyebrow">A LITTLE WARMTH FOR YOU</p><p class="winter-greeting">立冬快乐</p><h1 class="title">立冬快乐逸冉！</h1><p class="subtitle">愿你在每一个寒冷的日子里，都被温柔惦记</p><div class="bottom"><button class="replay" id="replay" type="button">再下一场温柔的雪 ↗</button><p class="note">轻点雪地，也会有新的话出现</p></div></div>
    <div class="grain" aria-hidden="true"></div>
  </main>
  <script>
    const phrases=["立冬快乐，好运开场","今天也有新的好事发生","愿你每天都有小惊喜","你的笑容让冬天发光","一步一步，走向喜欢的生活","你认真生活的样子很耀眼","今天的你也很棒","愿热爱与好运常伴你左右","你的每份努力都有意义","把今天过得热气腾腾","愿你心里有光，脚下有路","这场雪替我送来好消息","愿你被快乐轻轻包围","你的勇气比想象中更多","新的季节，新的好心情","有你的日子更明亮","愿你把喜欢的事做得闪闪发光","每一次出发都值得喝彩","未来的惊喜正在路上","你的善良会遇见温柔","愿你常常遇见可爱的人和事","今天适合拥抱小确幸","你的小进步都值得庆祝","把笑容交给今天吧","好事会在不经意间出现","愿你遇见更好的风景","你的光芒不会被冬天藏住","生活正慢慢变成喜欢的模样","愿你日日有期待","认真生活的你最动人","让好运像雪花一样落下来","愿你一抬头就看见晴朗","今天也要满怀期待呀","喜欢的事值得慢慢去做","愿你身边总有暖意","这个冬天会有很多好消息","每天都能找到开心的理由","你值得拥有明媚的日子","愿你的快乐有迹可循","愿你收获满满的喜欢","今天也想把好运分给你","从现在开始，好事连连","愿你一直勇敢又自由","你的存在就是一份美好","冬天来了，快乐也来了","愿你一路繁花，一路晴天","这个冬天有甜甜的惊喜","愿你的每一天都闪闪发亮","等雪停，我们一起看太阳","喜欢的生活正在向你靠近","你比昨天又前进了一点点","愿你走到哪里都带着笑","每个新早晨都值得期待","今天的阳光也为你而来","愿你心想事成，平安喜乐","把好心情装进口袋里","愿你眼里有星光，心中有方向","新的一天，继续闪闪发光","愿所有美好都如期而至","你笑起来，世界就亮一点","Good luck forever","永远快乐永远快乐永远快乐永远快乐永远快乐永远快乐","暴富暴富暴富暴富暴富暴富暴富","晚安，做个甜甜的梦","好运好运好运好运好运好运","开心开心开心开心开心开心","心想事成心想事成心想事成","今天也要闪闪发光呀"];
    const icons=["🎁","🥳","💄","🦢","👜","🕊️","🍰","💒","🔮","🚬","🎇","🎆","🌠","🌌","🧧","💌","💝","💘","💖","㊗️","🀪","☻","✦"];
    const snow=document.getElementById('snow'),messages=document.getElementById('messages'),fireworks=document.getElementById('fireworks'),flowers=document.getElementById('flowers'),prompt=document.getElementById('prompt'),scene=document.getElementById('scene');
    for(let i=0;i<95;i++){const f=document.createElement('i');f.className='flake';f.style.cssText=`left:${Math.random()*100}%;--size:${(Math.random()*4+2).toFixed(1)}px;--opacity:${(Math.random()*.55+.25).toFixed(2)};--blur:${Math.random()>.75?'1px':'0px'};--duration:${(Math.random()*12+9).toFixed(1)}s;--delay:${(-Math.random()*20).toFixed(1)}s;--drift:${(Math.random()*130-65).toFixed(0)}px`;snow.appendChild(f)}
    let timer,sequence=0,last=-1;const narrow=()=>innerWidth<=700;
    const fireColors=['#ffce43','#ff69ab','#85bbff','#70ead0','#d39aff','#fff1bb'];
    const fireGlyphs=['✦','✧','♥','☾','✿','❋','✵'];
    const fireShapes=['circle','heart','crescent','star'];
    function burstPoint(shape,i,count,radius){
      const angle=i*2*Math.PI/count-Math.PI/2;
      if(shape==='heart'){
        const t=i*2*Math.PI/count;
        return [16*Math.sin(t)**3*radius/18,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*radius/18];
      }
      if(shape==='crescent'){
        const half=count/2;
        if(i<half){const a=-Math.PI/2+i*Math.PI/(half-1);return [-Math.cos(a)*radius,Math.sin(a)*radius]}
        const a=Math.PI/2-(i-half)*Math.PI/(half-1);
        return [(-.45*Math.cos(a)+.2)*radius,.75*Math.sin(a)*radius];
      }
      const r=shape==='star'?(i%2?radius*.46:radius):radius;
      return [Math.cos(angle)*r,Math.sin(angle)*r];
    }
    function showFirework(x,y){
      const burst=document.createElement('div');
      const shape=fireShapes[Math.floor(Math.random()*fireShapes.length)];
      const color=fireColors[Math.floor(Math.random()*fireColors.length)];
      const radius=(narrow()?55:78)+Math.random()*(narrow()?22:30);
      burst.className='burst';
      burst.style.left=x+'%';burst.style.top=y+'%';burst.style.setProperty('--glow',color);
      const fragment=document.createDocumentFragment();
      for(let i=0;i<16;i++){
        const [dx,dy]=burstPoint(shape,i,16,radius*(.85+Math.random()*.3));
        const spark=document.createElement('span');
        const theme=shape==='heart'?'♥':shape==='crescent'?'☾':shape==='star'?'✦':'✧';
        spark.className='spark';spark.textContent=i%4===0?fireGlyphs[Math.floor(Math.random()*fireGlyphs.length)]:theme;
        spark.style.setProperty('--dx',dx.toFixed(1)+'px');spark.style.setProperty('--dy',dy.toFixed(1)+'px');
        spark.style.setProperty('--color',i%3===0?fireColors[(fireColors.indexOf(color)+i)%fireColors.length]:color);
        spark.style.setProperty('--size',(14+Math.random()*11).toFixed(1)+'px');
        spark.style.setProperty('--spin',(Math.random()*180-90).toFixed(0)+'deg');
        spark.style.setProperty('--delay',(Math.random()*.16).toFixed(2)+'s');
        fragment.appendChild(spark);
      }
      burst.appendChild(fragment);if(fireworks.children.length>=5)fireworks.firstElementChild.remove();fireworks.appendChild(burst);
      setTimeout(()=>burst.remove(),1700);
    }
    let flowerCount=0;
    function flowerSvg(kind){
      const peony=kind==='peony';
      const colors=peony?['#f9c6d5','#f2a5bd','#ffdce5']:['#fffef9','#f0f2ef','#e5e8e5'];
      const outer=Array.from({length:10},(_,i)=>`<ellipse cx="50" cy="34" rx="14" ry="25" transform="rotate(${i*36} 50 53)" fill="${colors[i%3]}" stroke="${peony?'#e58eac':'#d7ddd9'}" stroke-width=".8"/>`).join('');
      const inner=Array.from({length:8},(_,i)=>`<ellipse cx="50" cy="43" rx="10" ry="17" transform="rotate(${i*45+20} 50 53)" fill="${colors[(i+1)%3]}" stroke="${peony?'#e994ad':'#d7ddd9'}" stroke-width=".7"/>`).join('');
      const middle=peony?'<circle cx="50" cy="53" r="9" fill="#f9e1a7"/><circle cx="46" cy="50" r="1.7" fill="#d6a75e"/><circle cx="54" cy="49" r="1.7" fill="#d6a75e"/><circle cx="52" cy="56" r="1.7" fill="#d6a75e"/>':'<circle cx="50" cy="53" r="10" fill="#fffdf4"/><path d="M42 55c5-11 20-11 23-2 2 8-5 14-12 12-6-1-6-7-2-9 3-2 6 1 5 3" fill="none" stroke="#cdd4cc" stroke-width="2" stroke-linecap="round"/>';
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M49 76Q22 65 13 83Q26 93 50 81Q72 64 88 83Q73 94 50 81" fill="#749b83" stroke="#527f69" stroke-width="1.5"/>${outer}${inner}${middle}</svg>`;
    }
    function fallFlower(x,y){
      const kind=flowerCount++%2===0?'peony':'rose';
      const width=scene.clientWidth,height=scene.clientHeight;
      const fromX=x*width/100,fromY=y*height/100;
      const landX=Math.max(35,Math.min(width-35,fromX+(Math.random()-.5)*110));
      const distance=(landX-width/2)/(width/2);
      const landY=Math.min(height-24,height*(.80+.1*distance*distance)+18+Math.random()*22);
      const flower=document.createElement('div');
      flower.className='flower';flower.innerHTML=flowerSvg(kind);
      flower.style.left=landX+'px';flower.style.top=landY+'px';
      flower.style.setProperty('--from-x',(fromX-landX).toFixed(1)+'px');
      flower.style.setProperty('--from-y',(fromY-landY).toFixed(1)+'px');
      flower.style.setProperty('--flower-size',(narrow()?36+Math.random()*13:43+Math.random()*18).toFixed(1)+'px');
      flower.addEventListener('animationend',event=>{
        if(event.animationName==='flowerFall')setTimeout(()=>flower.classList.add('fade'),5000);
        if(event.animationName==='flowerFade')flower.remove();
      });
      if(flowers.children.length>=12)flowers.firstElementChild.remove();flowers.appendChild(flower);
    }
    function showPhrase(){let n=Math.floor(Math.random()*phrases.length);if(n===last)n=(n+1)%phrases.length;last=n;let el=document.createElement('span');el.className='message';el.textContent=phrases[n];el.dataset.icon=icons[Math.floor(Math.random()*icons.length)];let x=20+Math.random()*60,y;if(narrow()){y=32+Math.random()*43;x=30+Math.random()*40}else{y=33+Math.random()*42}if(phrases[n].length>18)x=50;el.style.setProperty('--x',x+'%');el.style.setProperty('--y',y+'%');el.style.setProperty('--tilt',(Math.random()*8-4).toFixed(1)+'deg');if(messages.children.length>=13)messages.firstElementChild.remove();messages.appendChild(el);showFirework(x,y);el.addEventListener('animationend',()=>{el.remove();fallFlower(x,y)},{once:true})}
    function shower(){clearInterval(timer);const run=++sequence;prompt.classList.add('hide');for(let i=0;i<4;i++)setTimeout(showPhrase,i*400);timer=setInterval(showPhrase,850);setTimeout(()=>{if(sequence===run){clearInterval(timer);timer=setInterval(showPhrase,1300)}},6500)}
    document.getElementById('replay').addEventListener('click',e=>{e.stopPropagation();shower()});scene.addEventListener('click',e=>{if(e.target.closest('button'))return;showPhrase();setTimeout(showPhrase,180)});setTimeout(shower,1250);
  </script>
</body>
</html>
